name: Build Fireplace Alpha

on:
  workflow_dispatch:
  push:
    branches:
      - fireplace-alpha

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Test and publish Fireplace add-on image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Set Fireplace Alpha version
        run: pnpm run release:version 2.1.0-alpha.902

      - name: Build
        run: pnpm run build
        env:
          BASE_URL: /home-assistant-matter-hub
          APP_VERSION: 2.1.0-alpha.902

      - name: Package
        run: pnpm run release:pack

      - name: Setup Docker
        uses: ./.github/actions/setup-docker

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish add-on image
        uses: ./.github/actions/docker
        with:
          push: true
          channel: fireplace-alpha
          dockerfile: apps/home-assistant-matter-hub/addon.Dockerfile
          package-version: 2.1.0-alpha.902
