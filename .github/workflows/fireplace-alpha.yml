name: Build Fireplace Alpha

on:
  workflow_dispatch:
  push:
    branches:
      - fireplace-alpha

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Test and publish Fireplace add-on image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Set Fireplace Alpha version
        run: pnpm run release:version 2.1.0-alpha.905

      - name: Build
        run: pnpm run build
        env:
          BASE_URL: /home-assistant-matter-hub
          APP_VERSION: 2.1.0-alpha.905

      - name: Package
        run: pnpm run release:pack

      - name: Setup Docker
        uses: ./.github/actions/setup-docker

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish add-on image
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: ${{ matrix.platform }}
          context: apps/home-assistant-matter-hub
          file: apps/home-assistant-matter-hub/addon.Dockerfile
          build-args: |
            NODE_VERSION=22
            PACKAGE_VERSION=2.1.0-alpha.905
          tags: |
            ghcr.io/charlie508010/home-assistant-matter-hub-fireplace-addon:2.1.0-alpha.905-${{ matrix.arch }}
            ghcr.io/charlie508010/home-assistant-matter-hub-fireplace-addon:fireplace-alpha-${{ matrix.arch }}

  publish-manifest:
    name: Publish Fireplace multi-architecture manifest
    needs: build-and-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifests
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/charlie508010/home-assistant-matter-hub-fireplace-addon:2.1.0-alpha.905 \
            --tag ghcr.io/charlie508010/home-assistant-matter-hub-fireplace-addon:fireplace-alpha \
            ghcr.io/charlie508010/home-assistant-matter-hub-fireplace-addon:2.1.0-alpha.905-amd64 \
            ghcr.io/charlie508010/home-assistant-matter-hub-fireplace-addon:2.1.0-alpha.905-arm64

      - name: Verify manifest
        run: docker buildx imagetools inspect ghcr.io/charlie508010/home-assistant-matter-hub-fireplace-addon:2.1.0-alpha.905
